# @package _global_
# Generated by scripts/dev/generate_experiment_configs.py.
defaults:
- _self_
- /resources: inherit
system: tdm-alpha
scenario_ids:
- 1
opponent: null
num_episodes: 1
seed: null
num_envs: 32
metrics: null
replay_episodes: null
output_dir: null
resume_from: null
preview: false
hydra:
  callbacks:
    launch:
      _target_: marl_battlegrounds.experiments.hydra._prepare_launch
      mode: ${hydra.mode}
      output_dir: ${oc.select:output_dir,null}
      resume_from: ${resume_from}
      launch_dir: ${hydra.run.dir}
      records_subdir: ${hydra.output_subdir}
      scenario_inputs:
        scenario_ids: ${scenario_ids}
        system: ${system}
        opponent: ${opponent}
        resources: ${resources}
  job:
    chdir: false
  run:
    dir: ${marl_launch_dir:${output_dir},scenario_evaluation,null,${resume_from}}
  output_subdir: .hydra
