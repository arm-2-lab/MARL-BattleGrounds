# Python package, dependency groups and developer-tool configuration.
# pyproject.toml declares intent; uv.lock records exact resolved versions.
# Runtime code lives under src. Extras install dependencies, not a complete
# learner or every adapter. CONTRIBUTING.md explains the dependency rules.
[project]
name = "marl-battlegrounds"
version = "1.0.0"
description = "The JAX-native Benchmark for Heterogeneous and Competitive Multi-agent Reinforcement Learning."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Ulixes Tariq Hawili", email = "t.hawili@sms.ed.ac.uk" }
]
keywords = [
  "multi-agent reinforcement learning",
  "reinforcement learning",
  "JAX",
  "benchmark",
  "heterogeneous agents",
  "competitive games",
  "team deathmatch",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "jax==0.10.1",
  "numpy",
  "scipy",
  "chex",
  "pydantic",
  "huggingface_hub>=2.2,<3",
  "flatbuffers>=24",
]

[project.urls]
Homepage = "https://marl-battlegrounds.com"
Documentation = "https://marl-battlegrounds.com/#guides"
Repository = "https://github.com/oceansystemslab/MARL-BattleGrounds"
Issues = "https://github.com/oceansystemslab/MARL-BattleGrounds/issues"
Changelog = "https://github.com/oceansystemslab/MARL-BattleGrounds/releases"

[project.optional-dependencies]
cuda13 = [
  "jax[cuda13]==0.10.1",
]
cuda12 = ["jax[cuda12]==0.10.1"]
rocm = [
  "jax[rocm7-local]==0.10.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "jax-rocm7-plugin==0.10.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
tpu = ["jax[tpu]==0.10.1; sys_platform == 'linux' and platform_machine == 'x86_64'"]
all = [
  "marl-battlegrounds[training,hydra,notebook,viz]",
]

training = [
  "optax",
  "flax",
  "orbax-checkpoint",
  "flashbax==0.1.3",
  "matplotlib",
]

hydra = [
  "hydra-core==1.3.7",
  "omegaconf==2.3.0",
]

notebook = [
  "pandas",
  "ipykernel",
  "nbconvert",
]

wandb = [
  "wandb",
]

viz = [
  "matplotlib",
]

dev = [
  "pytest",
  "ruff",
  "pyright",
  "pre-commit",
  "hydra-core==1.3.7",
  "omegaconf==2.3.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.local/dev_client/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/marl_battlegrounds", "src/hydra_plugins"]

[tool.hatch.build.targets.wheel.force-include]
"web/visual_debugger/index.html" = "marl_battlegrounds/viewer/web/index.html"
"web/visual_debugger/styles.css" = "marl_battlegrounds/viewer/web/styles.css"
"web/visual_debugger/src" = "marl_battlegrounds/viewer/web/src"
"web/visual_debugger/assets" = "marl_battlegrounds/viewer/web/assets"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/web/visual_debugger/index.html",
  "/web/visual_debugger/styles.css",
  "/web/visual_debugger/src",
  "/web/visual_debugger/assets",
]

[dependency-groups]
jupyter = ["jupyterlab"]

[tool.uv]
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }, { extra = "rocm" }, { extra = "tpu" }]]
# Minimum safe versions of indirect dependencies with known vulnerabilities.
constraint-dependencies = [
  "fsspec>=2026.6.0",
  "msgpack>=1.2.1",
  "pillow>=12.3.0",
  "virtualenv>=21.7.13",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N",
  "ANN",
  "SIM",
  "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = [
  "src",
  "tests",
  "examples",
  "scripts/paper_experiments",
  "scripts/dev/generate_experiment_configs.py",
  "scripts/dev/training_distribution_reference.py",
  "scripts/dev/benchmark_training_distributions.py",
  "scripts/dev/visual_debugger",
  "scripts/dev/replay_viewer.py",
  "play.py",
]
exclude = [
  "**/__pycache__",
  ".venv",
  "artifacts",
  "runs",
  "outputs",
  "checkpoints",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownMemberType = "none"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
tmp_path_retention_policy = "failed"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
