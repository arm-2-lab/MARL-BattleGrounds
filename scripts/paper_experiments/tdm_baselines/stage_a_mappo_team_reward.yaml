# Recurrent MAPPO's team-reward row of the Team Deathmatch settings search.
#
# One case, 40,108,032 steps on seeds 20261211, 20261212 and 20261213: stage A's recurrent MAPPO
# row epochs-10-clip-1e-1 (stage_a_external.yaml) with the team form of the reward,
# combat_support_team_reward. Everything else is as in stage A: training opponents are weights
# (60% the learner itself, 20% its 12 newest saved copies, 15% the six learned teams at
# 40,108,032 steps, 5% the three scripted bots), and the validation set is the six teams' saves
# near 80M, on maps 42 to 46. Each seed runs as its own one-seed study on whichever card is free,
# from a file that differs only in the seed, the card and the name. Prepare it with prepare.py
# protocol=declared_study before starting it; preparation checks the opponent bundle against
# opponents.yaml beside this file.
