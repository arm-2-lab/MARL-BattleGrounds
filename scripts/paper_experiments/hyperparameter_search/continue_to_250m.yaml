# Study 3 of the six-method hyperparameter search: continue each method's
# tournament run from 40,108,032 to 250,675,200 transitions. The six selected
# checkpoints play in the tournament (tournament_250m.json).
#
# Each case continues the run's full learner checkpoint at 40,108,032 with
# extend_training; it is one lineage with its parent, not a new seed. Everything not listed under changes is inherited
# from the parent: reward, opponents, exploration, validation panel and maps,
# seed pairs and actor retention.
#
# Paths are relative to <search root>/250m/protocol/, the same layout as the
# other studies (<search root>/<study>/study/cases/<case>/run). Copy this file
# there as study.yaml and start it from a frozen worktree:
#
#   python -m marl_battlegrounds study start \
#     --config <search root>/250m/protocol/study.yaml \
#     --output-dir <search root>/250m/study
#
# Choices:
#   - Parents: each method's strongest single run of studies 1 and 2, judged by
#     confirmation point margin, kills and deaths together, not by its recipe's
#     three-seed mean (docs/training/hyperparameter_search.md, Final Recipes).
#     Feedforward MAPPO's parent is its 40M team-reward run
#     (ff_mappo_team_reward.yaml, prepared into <search root>/ff-mappo-levers).
#   - Validation: 20 routine checks, one every 5% of the added budget
#     (about every 10.5M transitions), the last at 250,675,200. Parent
#     candidates stay eligible, so a run's selected checkpoint can be a parent
#     checkpoint when nothing later beats it.
#   - Learning rates: PPO and QMIX rates are constant and carry over. PQN-VDN's
#     rate fell linearly from 0.00025 to about 0 over its 40M run. It restarts
#     at 0.00021 and falls linearly to 1e-10 over the 102,816 added optimizer
#     steps (2,142 learning blocks of 4 epochs x 12 minibatches), reaching the
#     bottom at the last update, at 250,675,200. 0.00021 = 0.00025 x (1 - 0.16):
#     the rate a run planned for 250M from the start would have at 40,108,032
#     (16% of 250,675,200), so 40M-250M follows that run's schedule.
#
# Longest runs first. Measured cost 23.4 GPU-hours on RTX 5090s, one run per
# card at a time.
