# Build, check, install-test and publish a release of marl-battlegrounds.
# A manual start is the release's dry run, run on the exact commit that is
# tagged afterwards. It proves every published install route, the way a user
# runs it, with .github/scripts/check_install.sh: pip with Python 3.12, 3.13 and
# 3.14 on Linux x86_64, Linux ARM and an Apple Silicon Mac; the one command
# (start.sh), the BattleClient and every notebook on those three; the oldest
# Linux the install guide names (Ubuntu 20.04, Debian 10, RHEL 8) on x86_64 and
# ARM; the Docker images with Docker and Podman, natively on ARM, and with
# Apptainer. It uploads, attaches and pushes nothing.
# Publishing a GitHub Release runs the publishing jobs: build the wheel and
# sdist, check them, write one constraints file per GPU choice from uv.lock,
# install the wheel on Linux and macOS (the publish guard), upload to PyPI by
# Trusted Publishing, attach the files to the Release, and build, check and
# push the two Docker images to GHCR: ghcr.io/arm-2-lab/marl-battlegrounds:
# <version> (CPU, amd64 and arm64) and :<version>-cuda12 (NVIDIA, amd64). Their
# builds download the six Season 0 models, so the Hugging Face repositories
# must be public first.
# The tag must equal "v" plus the version in pyproject.toml.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "Tag ${TAG} does not match package version ${version}."
            exit 1
          fi
          if ! grep -qx "version: \"${version}\"" CITATION.cff; then
            echo "CITATION.cff does not give version ${version}."
            exit 1
          fi

      - name: Build the wheel and sdist
        run: uv build --out-dir dist

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Check the wheel holds the browser files
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          needed = (
              "marl_battlegrounds/viewer/web/index.html",
              "marl_battlegrounds/viewer/web/styles.css",
          )
          missing = [name for name in needed if name not in names]
          if missing or not any(n.startswith("marl_battlegrounds/viewer/web/src/") for n in names):
              sys.exit(f"wheel is missing browser files: {missing}")
          PY

      - name: Keep the package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  constraints:
    name: Write the constraints files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"

      - name: Export one constraints file per GPU choice
        run: |
          mkdir constraints
          for choice in cpu cuda13 cuda12 rocm tpu; do
            extra=()
            if [[ "${choice}" != "cpu" ]]; then extra=(--extra "${choice}"); fi
            uv export --frozen --no-hashes --no-annotate --no-emit-project \
              --no-default-groups --format requirements-txt \
              --extra all "${extra[@]}" --output-file "constraints/constraints-${choice}.txt"
          done
          if grep -qiE '^(nvidia-|jax-cuda|jax-rocm|libtpu)' constraints/constraints-cpu.txt; then
            echo "The CPU constraints file names a GPU package."
            exit 1
          fi

      - name: Keep the constraints files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: constraints
          path: constraints/
          if-no-files-found: error

  # A release runs only the publish guard (Python 3.14 on Linux and macOS); the
  # dry run on the same commit already ran every cell. On a Mac, the dry run's
  # pip checks run in the mac-install job instead (macOS minutes cost 10x).
  smoke-test:
    name: pip install (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build, constraints]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'release' && '{"include":[{"os":"ubuntu-latest","python":"3.14"},{"os":"macos-latest","python":"3.14"}]}' || '{"os":["ubuntu-latest","ubuntu-24.04-arm"],"python":["3.12","3.13","3.14"]}') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"

      - name: Fetch the package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Fetch the constraints files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: constraints
          path: constraints

      - name: pip install, the quick start and a released model by name
        env:
          PYTHON: ${{ matrix.python }}
          CONSTRAINTS: ${{ matrix.python == '3.14' && 'constraints' || '' }}
        run: sh .github/scripts/check_install.sh pip "${PYTHON}" ${CONSTRAINTS}

  mac-install:
    name: Every route on an Apple Silicon Mac
    if: github.event_name != 'release'
    needs: [build, constraints]
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Fetch the constraints files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: constraints
          path: constraints

      # First, because start.sh must install uv itself, as on a new Mac.
      - name: The one command, the BattleClient, a released model and the notebooks
        run: sh .github/scripts/check_install.sh start

      # A ~/.config this user cannot write, as on one tester's Mac: uv's
      # installer then fails after putting uv in place, and start.sh must carry on.
      - name: The one command again, with a read-only ~/.config
        run: sh .github/scripts/check_install.sh start-readonly-config

      - name: pip install on Python 3.12, 3.13 and 3.14
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          sh .github/scripts/check_install.sh pip 3.12
          sh .github/scripts/check_install.sh pip 3.13
          sh .github/scripts/check_install.sh pip 3.14 constraints

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build, constraints, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Fetch the package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  attach-files:
    name: Attach the files to the Release
    if: github.event_name == 'release'
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch the package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Fetch the constraints files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: constraints
          path: constraints

      - name: Upload the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "${TAG}" dist/* constraints/*.txt
          --clobber --repo "${GITHUB_REPOSITORY}"

  start-script:
    name: One-command install (${{ matrix.os }})
    if: github.event_name != 'release'
    needs: [smoke-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The one command, the BattleClient, a released model and the notebooks
        run: sh .github/scripts/check_install.sh start

  oldest-linux:
    name: Oldest Linux the install guide names (${{ matrix.os }})
    if: github.event_name != 'release'
    needs: [smoke-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # glibc 2.31, 2.28 and 2.28: the floor the install guide states.
      - name: Install and evaluate on Ubuntu 20.04, Debian 10 and RHEL 8
        run: |
          for image in buildpack-deps:focal-curl buildpack-deps:buster-curl rockylinux:8; do
            sh .github/scripts/check_install.sh oldest "${image}"
          done

  docker-cpu:
    name: Docker image (CPU, amd64 and arm64)
    needs: [smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/arm-2-lab/marl-battlegrounds

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version from the tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: echo "VERSION=${TAG#v}" >> "${GITHUB_ENV}"

      - name: Set up a builder for amd64 and arm64
        run: |
          docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
          docker buildx create --use --name multi-arch

      # The BattleClient against the baked-in Season 0 model, then an offline
      # evaluation as the owner of the mounted folder.
      - name: Build for amd64 and check it as a user runs it
        run: |
          docker buildx build -f docker/Dockerfile --platform linux/amd64 --load -t local/cpu .
          sh .github/scripts/check_install.sh container docker local/cpu

      - name: Run the same image with Podman
        if: github.event_name != 'release'
        run: |
          docker tag local/cpu localhost/marl-bgs-cpu:check
          docker save localhost/marl-bgs-cpu:check | podman load
          sh .github/scripts/check_install.sh container podman localhost/marl-bgs-cpu:check

      - name: Build for arm64 and check it under emulation
        run: |
          docker buildx build -f docker/Dockerfile --platform linux/arm64 --load -t local/cpu-arm64 .
          docker run --rm --platform linux/arm64 -e HF_HUB_OFFLINE=1 local/cpu-arm64 evaluate \
            --system MARL-BattleGrounds/tdm-season-0-recurrent-mappo --opponent tdm-alpha \
            --episodes 2 --maps 47 --num-envs 2 --output-dir /tmp/check

      - name: Push amd64 and arm64 to GHCR
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build -f docker/Dockerfile --platform linux/amd64,linux/arm64 --push \
            --label org.opencontainers.image.source=https://github.com/arm-2-lab/MARL-BattleGrounds \
            --label "org.opencontainers.image.description=MARL-BattleGrounds ${VERSION}, CPU" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -t "${IMAGE}:${VERSION}" .

  docker-arm64-native:
    name: Docker image (CPU, arm64, on an ARM machine)
    if: github.event_name != 'release'
    needs: [smoke-test]
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build natively and check it as a user runs it
        run: |
          docker build -f docker/Dockerfile -t local/cpu .
          sh .github/scripts/check_install.sh container docker local/cpu

  docker-cuda12:
    name: Docker image (NVIDIA CUDA 12, amd64)
    needs: [smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/arm-2-lab/marl-battlegrounds

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version from the tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: echo "VERSION=${TAG#v}-cuda12" >> "${GITHUB_ENV}"

      # The CUDA 12 image is about 10 GB; remove large preinstalled tools first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Build and check it as a user runs it, on the CPU
        run: |
          docker build -f docker/Dockerfile --build-arg BUILD=cuda12 \
            --label org.opencontainers.image.source=https://github.com/arm-2-lab/MARL-BattleGrounds \
            --label "org.opencontainers.image.description=MARL-BattleGrounds ${VERSION}, NVIDIA CUDA 12" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -t "${IMAGE}:${VERSION}" .
          sh .github/scripts/check_install.sh container docker "${IMAGE}:${VERSION}"

      # The install guide's cluster route; this runner has no GPU, so no --nv.
      - name: Run the image with Apptainer on the CPU
        if: github.event_name != 'release'
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -q
          sudo apt-get install -y -q apptainer
          sh .github/scripts/check_install.sh apptainer "${IMAGE}:${VERSION}"

      - name: Push to GHCR
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${VERSION}"
