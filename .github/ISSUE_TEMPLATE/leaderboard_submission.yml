name: Leaderboard Submission
description: Enter your method in a Team Deathmatch season.
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [rules](https://github.com/arm-2-lab/MARL-BattleGrounds/blob/main/docs/tournament_rules.md) first.
        In your entry's folder, `uv run python -m marl_battlegrounds entry submit` opens this form filled in, once `entry check` passes on your commit.
        The issue title is your method's name, the `name` in `entry.yaml`. We read everything else from `entry.yaml` at your commit.

  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: The Git repository we clone.
      placeholder: https://github.com/you/your-method
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: The full 40-character commit SHA we run. Not a branch or a tag.
    validations:
      required: true

  - type: checkboxes
    id: private-repository
    attributes:
      label: Private Repository
      description: Tick this only if we need a key to clone your repository. We reply with a read-only key for this one entry. Add it under Settings > Deploy keys, with write access off. If you add it within 7 days of our reply, your place in the queue is this issue's time; after that, it is the time you add the key.
      options:
        - label: My repository is private
          required: false

  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I release this entry's code, results and saved models under Apache-2.0, entered or not.
          required: true
